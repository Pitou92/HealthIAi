server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: healthiai-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: healthiai
          __path__: /var/log/healthiai/*.log
    pipeline_stages:
      # Extract log filename to label logs as backend or frontend
      - regex:
          expression: '/var/log/healthiai/(?P<log_source>[a-zA-Z0-9_-]+)\.log'
          source: filename
      - labels:
          log_source:
